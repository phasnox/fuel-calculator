services:
  - type: web
    name: fuel-calculator
    runtime: elixir
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: _build/prod/rel/fuel_calculator/bin/server
    autoDeployTrigger: commit
    envVars:
      - key: ELIXIR_VERSION
        value: 1.18.4
      - key: ERLANG_VERSION
        value: "27.3"
      # Render's generateValue is 32 bytes; Plug's cookie store requires at
      # least 64. Enter the output of `mix phx.gen.secret` when deploying.
      - key: SECRET_KEY_BASE
        sync: false
